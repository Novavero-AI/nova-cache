name: 'Seed Nova Cache'
description: 'Push new Nix store paths to a nova-cache server, skipping paths already cached'

inputs:
  cache-url:
    description: 'Base URL of the nova-cache server (e.g. https://cache.novavero.ai)'
    required: true
  api-key:
    description: 'Bearer token for authenticating PUT requests'
    required: true
  paths:
    description: 'Nix store paths to push (space-separated). Defaults to all paths from the current nix-shell.'
    required: false
    default: ''
  parallel:
    description: 'Max concurrent uploads'
    required: false
    default: '32'

runs:
  using: 'composite'
  steps:
    - name: Seed cache
      shell: bash
      env:
        CACHE_URL: ${{ inputs.cache-url }}
        CACHE_API_KEY: ${{ inputs.api-key }}
        STORE_PATHS: ${{ inputs.paths }}
        PARALLEL: ${{ inputs.parallel }}
      run: |
        set -euo pipefail

        # --- Resolve store paths ---
        PATHS=""
        if [ -n "$STORE_PATHS" ]; then
          PATHS="$STORE_PATHS"
        elif [ -f shell.nix ] || [ -f default.nix ]; then
          # nix-build the shell to get runtime outputs (not .drv derivations)
          SHELL_OUT=$(nix-build shell.nix --no-out-link 2>/dev/null || nix-build default.nix --no-out-link 2>/dev/null || true)
          if [ -n "$SHELL_OUT" ]; then
            PATHS=$(nix-store -qR $SHELL_OUT 2>/dev/null || true)
          fi
        else
          echo "::warning::No store paths provided and no shell.nix/default.nix found."
          exit 0
        fi

        if [ -z "$PATHS" ]; then
          echo "::warning::No store paths resolved."
          exit 0
        fi

        WORK=$(mktemp -d)
        trap "rm -rf $WORK" EXIT

        # --- Build local hash list ---
        for p in $PATHS; do
          basename "$p" | sed 's/-.*//'
        done | sort -u > "$WORK/local-hashes.txt"

        TOTAL=$(wc -l < "$WORK/local-hashes.txt" | tr -d ' ')
        echo "Resolved $TOTAL unique store paths"

        # --- Fetch remote hashes ---
        if curl -sf "$CACHE_URL/narinfo-hashes" -o "$WORK/remote-hashes.txt" 2>/dev/null; then
          sort -u "$WORK/remote-hashes.txt" > "$WORK/remote-sorted.txt"
        else
          touch "$WORK/remote-sorted.txt"
        fi

        # --- Diff ---
        comm -23 "$WORK/local-hashes.txt" "$WORK/remote-sorted.txt" > "$WORK/missing-hashes.txt"

        MISSING=$(wc -l < "$WORK/missing-hashes.txt" | tr -d ' ')
        echo "Already cached: $((TOTAL - MISSING)), to upload: $MISSING"

        if [ "$MISSING" -eq 0 ]; then
          echo "Cache is up to date."
          exit 0
        fi

        # --- Export only missing paths ---
        for p in $PATHS; do
          hash=$(basename "$p" | sed 's/-.*//')
          if grep -qxF "$hash" "$WORK/missing-hashes.txt"; then
            echo "$p"
          fi
        done > "$WORK/missing-paths.txt"

        echo "Exporting $MISSING missing paths..."
        mkdir -p "$WORK/export"
        if ! xargs nix copy --to "file://$WORK/export" < "$WORK/missing-paths.txt" 2>&1 | tail -5; then
          echo "::warning::nix copy reported errors (continuing with partial export)"
        fi

        # Count what was actually exported
        EXPORTED=$(find "$WORK/export" -maxdepth 1 -name '*.narinfo' | wc -l | tr -d ' ')
        echo "Exported $EXPORTED narinfos"

        if [ "$EXPORTED" -eq 0 ]; then
          echo "::warning::nix copy produced no narinfos — nothing to upload."
          exit 0
        fi

        # --- Build upload lists ---
        mkdir -p "$WORK/ok" "$WORK/fail"

        # Only upload narinfos that are actually missing (nix copy exports transitive deps too)
        find "$WORK/export" -maxdepth 1 -name '*.narinfo' -exec basename {} .narinfo \; | \
          grep -Fxf "$WORK/missing-hashes.txt" > "$WORK/narinfo-list.txt" || true

        UPLOAD_COUNT=$(wc -l < "$WORK/narinfo-list.txt" | tr -d ' ')
        echo "Uploading $UPLOAD_COUNT paths (filtered from $EXPORTED exported)"

        # Build NAR list from the narinfos we plan to upload
        for hash in $(cat "$WORK/narinfo-list.txt"); do
          url=$(grep -m1 '^URL:' "$WORK/export/$hash.narinfo" 2>/dev/null | sed 's/^URL: *//' || true)
          if [ -n "$url" ]; then
            basename "$url"
          fi
        done | sort -u > "$WORK/nars.txt"

        # --- Upload NARs first (so NAR is present before narinfo becomes visible) ---
        NAR_OK=0
        NAR_FAIL=0
        if [ -s "$WORK/nars.txt" ]; then
          upload_nar() {
            local narfile="$1"
            if [ ! -f "$WORK/export/nar/$narfile" ]; then
              return 0
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              -T "$WORK/export/nar/$narfile" \
              -H "Authorization: Bearer $CACHE_API_KEY" \
              "$CACHE_URL/nar/$narfile") || code="000"
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
              touch "$WORK/ok/nar-$narfile"
            else
              echo "$code" > "$WORK/fail/nar-$narfile"
            fi
          }
          export -f upload_nar
          export CACHE_API_KEY WORK CACHE_URL
          xargs -P "$PARALLEL" -n1 -a "$WORK/nars.txt" bash -c 'upload_nar "$1"' _

          NAR_OK=$(find "$WORK/ok" -name 'nar-*' 2>/dev/null | wc -l | tr -d ' ')
          NAR_FAIL=$(find "$WORK/fail" -name 'nar-*' 2>/dev/null | wc -l | tr -d ' ')

          if [ "$NAR_FAIL" -gt 0 ]; then
            echo "Sample NAR failure codes:"
            for f in $(find "$WORK/fail" -name 'nar-*' | head -5); do
              echo "  $(basename "$f"): HTTP $(cat "$f")"
            done
          fi
        fi

        # --- Upload narinfos (after NARs so clients never see narinfo without its NAR) ---
        upload_narinfo() {
          local hash="$1"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer $CACHE_API_KEY" \
            --data-binary @"$WORK/export/$hash.narinfo" \
            "$CACHE_URL/$hash.narinfo") || code="000"
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
            touch "$WORK/ok/$hash"
          else
            echo "$code" > "$WORK/fail/$hash.narinfo"
          fi
        }
        export -f upload_narinfo
        export CACHE_API_KEY WORK CACHE_URL
        xargs -P "$PARALLEL" -n1 -a "$WORK/narinfo-list.txt" bash -c 'upload_narinfo "$1"' _

        NARINFO_OK=$(find "$WORK/ok" -type f ! -name 'nar-*' 2>/dev/null | wc -l | tr -d ' ')
        NARINFO_FAIL=$(find "$WORK/fail" -name '*.narinfo' 2>/dev/null | wc -l | tr -d ' ')

        if [ "$NARINFO_FAIL" -gt 0 ]; then
          echo "Sample narinfo failure codes:"
          for f in $(find "$WORK/fail" -name '*.narinfo' | head -5); do
            echo "  $(basename "$f"): HTTP $(cat "$f")"
          done
        fi

        echo ""
        echo "Nar:     $NAR_OK uploaded, $NAR_FAIL failed"
        echo "Narinfo: $NARINFO_OK uploaded, $NARINFO_FAIL failed (skipped $((TOTAL - MISSING)) cached)"

        if [ "$NARINFO_FAIL" -gt 0 ] || [ "$NAR_FAIL" -gt 0 ]; then
          echo "::warning::Some uploads failed. Cache may be partially seeded."
        fi

        # --- Validate one round-trip ---
        if [ "$NARINFO_OK" -gt 0 ]; then
          SAMPLE=$(ls "$WORK/ok" | grep -v '^nar-' | head -1)
          FETCHED=$(curl -sf "$CACHE_URL/$SAMPLE.narinfo" || true)

          if [ -z "$FETCHED" ]; then
            echo "::warning::Validation failed: $SAMPLE.narinfo not retrievable"
          elif ! echo "$FETCHED" | grep -q '^Sig:'; then
            echo "::warning::Validation failed: no signature on $SAMPLE.narinfo"
          else
            LOCAL_SP=$(grep -m1 '^StorePath:' "$WORK/export/$SAMPLE.narinfo" || true)
            REMOTE_SP=$(echo "$FETCHED" | grep -m1 '^StorePath:' || true)
            if [ "$LOCAL_SP" != "$REMOTE_SP" ]; then
              echo "::warning::Validation failed: StorePath mismatch on $SAMPLE"
            else
              echo "Validation passed: $SAMPLE"
            fi
          fi
        fi
