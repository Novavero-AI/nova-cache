name: Docs

# Re-upload documentation for an already-published release.  The publish
# workflow uploads docs for new releases; this exists for versions that
# shipped before it did (0.8.0.0), or if a doc upload ever needs redoing.
# Hackage's own doc builder runs an older GHC than the base floor admits,
# so maintainer-built docs are the only docs these releases get.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload documentation for (e.g. v0.8.0.0)
        required: true

permissions:
  contents: read

jobs:
  docs:
    name: Upload docs to Hackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      # Same tag-is-the-version rule as the publish workflow, for tags
      # whose tree predates the in-repo version bump.
      - name: Set version from tag
        run: |
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION=${TAG_VERSION#v}
          sed -i "s/^version:.*/version:            $TAG_VERSION/" nova-cache.cabal

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Build documentation
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION=${VERSION#v}
          # v0.8.0.0 gated NovaCache.Xz behind a manual xz flag inside the
          # main library; 0.9.0.0 moved it to the nova-cache:xz sublibrary
          # and deleted the flag.  cabal rejects flags the package does not
          # declare, so turn it on only where the tag's cabal defines it.
          HADDOCK_FLAGS=""
          if grep -q '^flag xz' nova-cache.cabal; then
            HADDOCK_FLAGS="--flags=xz"
          fi
          cabal haddock all $HADDOCK_FLAGS --haddock-for-hackage
          # Same sublibrary grafts as the publish workflow: cabal tars only
          # the main library's tree; Hackage serves sublibraries as
          # subdirectories of the one release tree (re-tarred as ustar -
          # Hackage's tar reader 400s GNU-format headers).  Driven by what
          # the tag's tree actually built: pre-0.9.0.0 trees have no l/
          # directory, so an unmatched glob must skip (under -e the bare
          # loop body would kill the job).  Undo the graft when
          # haskell/cabal#9577 lands (one tarball spanning every library).
          MAIN=$(find dist-newstyle -type d -name "nova-cache-${VERSION}-docs" -path "*/doc/html/*" -not -path "*/l/*")
          GRAFTED=""
          for LDIR in dist-newstyle/build/*/*/nova-cache-${VERSION}/l/*/; do
            [ -d "$LDIR" ] || continue
            NAME=$(basename "$LDIR")
            cp -R "$LDIR/doc/html/nova-cache-${VERSION}-docs/$NAME" "$MAIN/$NAME"
            GRAFTED="$GRAFTED $NAME"
          done
          # cabal names the sublibrary hoogle file nova-cache:xz.txt, and
          # Hackage validates tarball paths as Windows-portable - a colon
          # is an invalid character there and 400s the whole upload.  The
          # hoogle database is not rendered documentation; drop it.
          find "$MAIN" -name '*:*' -print -delete
          tar --format=ustar -czf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" -C "$(dirname "$MAIN")" "nova-cache-${VERSION}-docs"
          # Every sublibrary grafted above must show a module page in the
          # final listing - the graft can copy an empty tree if cabal's
          # layout shifts, and the tarball is all Hackage ever serves.
          # A hardcoded module list would break on tags that predate a
          # sublibrary, which is this workflow's whole audience.
          LISTING=$(tar -tzf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz")
          for NAME in $GRAFTED; do
            echo "$LISTING" | grep "nova-cache-${VERSION}-docs/${NAME}/" \
              | grep -v -e '/index\.html$' -e '/doc-index' | grep -q '\.html$' \
              || { echo "no module HTML for sublibrary ${NAME} in docs tarball"; exit 1; }
          done

      - name: Upload documentation to Hackage
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION=${VERSION#v}
          # Not --fail: on rejection Hackage's response body names the
          # offending entry, and losing it cost two blind retries once.
          STATUS=$(curl -X PUT --silent --show-error --output /tmp/docs-response.txt --write-out "%{http_code}" \
            --header "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            --header "Content-Type: application/x-tar" \
            --header "Content-Encoding: gzip" \
            --data-binary "@dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" \
            "https://hackage.haskell.org/package/nova-cache-${VERSION}/docs")
          cat /tmp/docs-response.txt
          echo "docs upload HTTP ${STATUS}"
          case "$STATUS" in 2??) ;; *) exit 22 ;; esac
