name: Publish

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Drop the default GITHUB_TOKEN to read-only; the Hackage upload uses its own
# token (HACKAGE_TOKEN), not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Hackage
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # v0.9.0.0 reached Hackage with its changelog section still headed
      # "## Unreleased" (the dating commit landed 73 minutes after the
      # tag), and a Hackage tarball is immutable - that heading is frozen
      # into the release forever.  Refuse to upload anything until the
      # changelog's top section is exactly this version, dated.
      - name: Verify changelog is dated for this release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TOP=$(grep -m 1 '^## ' CHANGELOG.md)
          case "$TOP" in
            "## ${VERSION} - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
              echo "changelog head: ${TOP}"
              ;;
            *)
              echo "CHANGELOG.md top section is '${TOP}'; expected '## ${VERSION} - YYYY-MM-DD'"
              exit 1
              ;;
          esac

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version:.*/version:            $TAG_VERSION/" nova-cache.cabal
          echo "Set version to $TAG_VERSION"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'
      - run: cabal sdist
      - name: Upload to Hackage
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # A docs failure downstream used to strand the release: the
          # sdist was already live, so the re-run died here on Hackage's
          # duplicate-version 400 without ever reaching the docs steps
          # (0.9.0.0 shipped docless exactly this way).  When the version
          # is already published, skip the sdist and let the docs steps
          # run; the probe hits this version's own cabal file, which 404s
          # for any version Hackage does not have.
          if curl --fail --silent --output /dev/null \
              "https://hackage.haskell.org/package/nova-cache-${VERSION}/nova-cache.cabal"; then
            echo "nova-cache-${VERSION} is already on Hackage; skipping sdist upload"
            exit 0
          fi
          SDIST=$(ls dist-newstyle/sdist/nova-cache-*.tar.gz)
          curl --fail --silent --show-error \
            --header "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            --form "package=@${SDIST}" \
            https://hackage.haskell.org/packages/
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}

      # Maintainer-built documentation, permanently - not a stopgap for
      # Hackage's doc builder lagging GHC (today it carries 9.8 against a
      # base >= 4.22 floor, so it cannot even plan the build).  Building
      # here documents every library, the xz sublibrary included, with
      # the same pinned toolchain the release was verified on, and the
      # docs land with the release instead of on the builder's schedule.
      - name: Build documentation
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cabal haddock all --haddock-for-hackage
          # cabal writes each library's tree separately and tars only the
          # main one; Hackage serves one tree per release with sublibraries
          # as subdirectories (the layout cabal itself names: <docs>/<name>).
          # Graft every sublibrary component in and re-tar as ustar -
          # Hackage's tar reader 400s GNU-format headers; cabal's own
          # tarballs are ustar.  The final greps fail the job if a cabal
          # layout change ever drops a module silently.  Undo the graft
          # when haskell/cabal#9577 lands (one tarball spanning every
          # library).
          MAIN=$(find dist-newstyle -type d -name "nova-cache-${VERSION}-docs" -path "*/doc/html/*" -not -path "*/l/*")
          for LDIR in dist-newstyle/build/*/*/nova-cache-${VERSION}/l/*/; do
            NAME=$(basename "$LDIR")
            cp -R "$LDIR/doc/html/nova-cache-${VERSION}-docs/$NAME" "$MAIN/$NAME"
          done
          # cabal names the sublibrary hoogle file nova-cache:xz.txt, and
          # Hackage validates tarball paths as Windows-portable - a colon
          # is an invalid character there and 400s the whole upload.  The
          # hoogle database is not rendered documentation; drop it.
          find "$MAIN" -name '*:*' -print -delete
          tar --format=ustar -czf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" -C "$(dirname "$MAIN")" "nova-cache-${VERSION}-docs"
          tar -tzf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" | grep -q "xz/NovaCache-Xz.html"
          tar -tzf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" | grep -q "zstandard/NovaCache-Zstd.html"
      - name: Upload documentation to Hackage
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Not --fail: on rejection Hackage's response body names the
          # offending entry, and losing it cost two blind retries once.
          STATUS=$(curl -X PUT --silent --show-error --output /tmp/docs-response.txt --write-out "%{http_code}" \
            --header "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            --header "Content-Type: application/x-tar" \
            --header "Content-Encoding: gzip" \
            --data-binary "@dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" \
            "https://hackage.haskell.org/package/nova-cache-${VERSION}/docs")
          cat /tmp/docs-response.txt
          echo "docs upload HTTP ${STATUS}"
          case "$STATUS" in 2??) ;; *) exit 22 ;; esac
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
