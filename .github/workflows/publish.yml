name: Publish

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Drop the default GITHUB_TOKEN to read-only; the Hackage upload uses its own
# token (HACKAGE_TOKEN), not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Hackage
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A Hackage tarball is immutable, so whatever heading the changelog
      # carries is frozen into the release.  Nothing is uploaded unless the
      # changelog's top section is exactly this version, dated.
      - name: Verify changelog is dated for this release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TOP=$(grep -m 1 '^## ' CHANGELOG.md)
          case "$TOP" in
            "## ${VERSION} - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
              echo "changelog head: ${TOP}"
              ;;
            *)
              echo "CHANGELOG.md top section is '${TOP}'; expected '## ${VERSION} - YYYY-MM-DD'"
              exit 1
              ;;
          esac

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version:.*/version:            $TAG_VERSION/" nova-cache.cabal
          echo "Set version to $TAG_VERSION"
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'
      - run: cabal sdist
      # Hackage's documentation builder runs a GHC older than this package's
      # base floor, so it cannot plan the build.  The documentation is built
      # here instead, for every library, the xz sublibrary included, with
      # the pinned toolchain the release was verified on.  It is built before
      # anything is uploaded, so the two uploads run back to back: a package
      # published before its documentation built would stay public without
      # it, since a version cannot be withdrawn.
      - name: Build documentation
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cabal haddock all --haddock-for-hackage
          # cabal writes each library's tree separately and tars only the
          # main one.  Hackage links a module from the package page only
          # when its HTML sits at the docs ROOT (docs/<Module>.html); a
          # per-sublibrary subdirectory renders as plain text.  So
          # flatten: graft every sublibrary's module and source pages
          # into the root of the release tree, keep one copy of the
          # assets, and re-tar as ustar - Hackage's tar reader 400s
          # GNU-format headers; cabal's own tarballs are ustar.  Module
          # names cannot collide across this package's components, but
          # fail loudly rather than overwrite if that ever changes.
          # Undo the graft when haskell/cabal#9577 lands (one tarball
          # spanning every library).
          MAIN=$(find dist-newstyle -type d -name "nova-cache-${VERSION}-docs" -path "*/doc/html/*" -not -path "*/l/*")
          mkdir -p "$MAIN/src"
          for LDIR in dist-newstyle/build/*/*/nova-cache-"${VERSION}"/l/*/; do
            [ -d "$LDIR" ] || continue
            NAME=$(basename "$LDIR")
            SUB="$LDIR/doc/html/nova-cache-${VERSION}-docs/$NAME"
            COPIED=0
            for PAGE in "$SUB"/*.html; do
              [ -e "$PAGE" ] || continue
              BASE=$(basename "$PAGE")
              case "$BASE" in index.html|doc-index*.html) continue ;; esac
              [ -e "$MAIN/$BASE" ] && { echo "collision grafting ${NAME}: ${BASE} exists at the root"; exit 1; }
              cp "$PAGE" "$MAIN/$BASE"
              COPIED=$((COPIED + 1))
            done
            [ "$COPIED" -gt 0 ] || { echo "no module HTML found for sublibrary ${NAME}"; exit 1; }
            for PAGE in "$SUB"/src/*.html; do
              [ -e "$PAGE" ] || continue
              BASE=$(basename "$PAGE")
              [ -e "$MAIN/src/$BASE" ] && { echo "collision grafting ${NAME} sources: src/${BASE} exists"; exit 1; }
              cp "$PAGE" "$MAIN/src/$BASE"
            done
          done
          # cabal names the sublibrary hoogle file nova-cache:xz.txt, and
          # Hackage validates tarball paths as Windows-portable - a colon
          # is an invalid character there and 400s the whole upload.  The
          # hoogle database is not rendered documentation; drop it.
          find "$MAIN" -name '*:*' -print -delete
          tar --format=ustar -czf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" -C "$(dirname "$MAIN")" "nova-cache-${VERSION}-docs"
          # Every codec module must sit at the docs root, or Hackage
          # ships an unlinked page again.
          LISTING=$(tar -tzf "dist-newstyle/nova-cache-${VERSION}-docs.tar.gz")
          for MODULE in NovaCache-Xz NovaCache-Bzip2 NovaCache-Zstd; do
            echo "$LISTING" | grep -q "^nova-cache-${VERSION}-docs/${MODULE}\.html$" \
              || { echo "${MODULE}.html missing from the docs root"; exit 1; }
          done
      - name: Upload to Hackage
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # A version Hackage already has is skipped, so a re-run after a
          # failed documentation upload gets past Hackage's duplicate-version
          # 400 to the docs step.  The probe hits this version's own cabal
          # file, which 404s for any version Hackage does not have.
          if curl --fail --silent --output /dev/null \
              "https://hackage.haskell.org/package/nova-cache-${VERSION}/nova-cache.cabal"; then
            echo "nova-cache-${VERSION} is already on Hackage; skipping sdist upload"
            exit 0
          fi
          SDIST=$(ls dist-newstyle/sdist/nova-cache-*.tar.gz)
          curl --fail --silent --show-error \
            --header "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            --form "package=@${SDIST}" \
            https://hackage.haskell.org/packages/
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}

      - name: Upload documentation to Hackage
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Not --fail: on rejection Hackage's response body names the
          # offending entry, and losing it cost two blind retries once.
          STATUS=$(curl -X PUT --silent --show-error --output /tmp/docs-response.txt --write-out "%{http_code}" \
            --header "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            --header "Content-Type: application/x-tar" \
            --header "Content-Encoding: gzip" \
            --data-binary "@dist-newstyle/nova-cache-${VERSION}-docs.tar.gz" \
            "https://hackage.haskell.org/package/nova-cache-${VERSION}/docs")
          cat /tmp/docs-response.txt
          echo "docs upload HTTP ${STATUS}"
          case "$STATUS" in 2??) ;; *) exit 22 ;; esac
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
