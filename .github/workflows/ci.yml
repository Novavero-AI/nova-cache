name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  ascii:
    name: ASCII source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source must be ASCII-only
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.hs' '*.c' '*.h' '*.cabal' '*.md' '*.nix' '*.sh'; then
            echo "Non-ASCII characters found above; keep the source ASCII-only (no smart quotes, em-dashes, or Unicode arrows)."
            exit 1
          fi

  lint:
    name: HLint
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/", "exe/"]'
          fail-on: warning

  format:
    name: Ormolu
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to the version the repo is formatted with: formatting is
      # not stable across ormolu releases, and a floating version would
      # fail CI on untouched code when upstream ships one.  Upgrades
      # bump this and the local binary together.
      #
      # Built from Hackage, not fetched prebuilt: run-ormolu@v21
      # downloads binaries from mrkkrp/ormolu, and that repository
      # vanished from GitHub on 2026-08-20, taking every prebuilt
      # ormolu with it (the action then misreports the 404 as
      # "unformatted files").  The Hackage build depends on nothing but
      # the package index; the cached binary makes warm runs seconds.
      # Undo into the action if prebuilt assets return to a stable home
      # a released run-ormolu points at.
      - name: Cache formatter binary
        id: formatter-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/ormolu
          key: ormolu-0.9.0.0-${{ runner.os }}

      - uses: haskell-actions/setup@v2
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Build ormolu 0.9.0.0 from Hackage
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        run: cabal install ormolu-0.9.0.0 --install-method=copy --installdir="$HOME/.local/bin" --overwrite-policy=always

      - name: Check formatting
        run: git ls-files '*.hs' | xargs ormolu --mode check

  # ---------------------------------------------------------------------------
  # cbits/nova_bzip2.c is the only hand-written C in the tree, and the build
  # compiles it with whatever warnings GHC's bootstrap toolchain defaults to
  # - quiet enough that GNU extensions and implicit conversions never
  # surface.  This job holds it to strict C99 instead.  Syntax-only, so
  # nothing links or runs; declarations come from bzip2-clib's own bundled
  # bzlib.h, fetched from Hackage rather than apt's libbz2-dev, so the lint
  # reads the same header the build compiles against instead of a lookalike.
  #
  # -Wconversion -Wsign-conversion earn their place beyond the usual set:
  # the shim's entire job is marshalling, and bz_stream's avail_in/avail_out
  # are 32-bit unsigned while the Haskell side hands down Int.  Implicit
  # narrowing there is the one defect class this file can plausibly carry,
  # and -Wall -Wextra -pedantic does not diagnose it.
  # ---------------------------------------------------------------------------

  c99-lint:
    name: C99 Strict
    needs: [ascii]
    runs-on: ubuntu-latest
    env:
      # Matches the floor of the bzip2-clib bound in nova-cache.cabal.
      BZIP2_CLIB_VERSION: 1.0.8
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the bundled bzlib.h the build compiles against
        run: |
          mkdir -p "$RUNNER_TEMP/clib-include"
          curl -fsSL \
            "https://hackage.haskell.org/package/bzip2-clib-$BZIP2_CLIB_VERSION/bzip2-clib-$BZIP2_CLIB_VERSION.tar.gz" \
            | tar -xz --strip-components=2 -C "$RUNNER_TEMP/clib-include" \
                "bzip2-clib-$BZIP2_CLIB_VERSION/cbits/bzlib.h"

      - name: Compile C99 with strict warnings
        run: |
          for f in cbits/*.c; do
            echo "Checking $f ..."
            gcc -std=c99 -Wall -Wextra -pedantic -Wconversion -Wsign-conversion \
                -Werror -fsyntax-only -Icbits -I"$RUNNER_TEMP/clib-include" "$f"
          done

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.name }})
    needs: [lint, format, cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      # all + -f server + --enable-tests so the server executable, the xz
      # sublibrary, and the test suites hit the same -Werror bar as the
      # library on every OS.  No liblzma setup: lzma-static bundles the C
      # sources.  The sdist job builds the same set from the tarball.
      - name: Build
        run: cabal build all -f server --enable-tests --ghc-options="-Werror"

      - name: Test
        run: cabal test -f server --ghc-options="-Werror"

  # ---------------------------------------------------------------------------
  # Packaging check (Linux-only)
  # ---------------------------------------------------------------------------

  cabal-check:
    name: Cabal Check
    needs: [lint, format, c99-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'
      - run: cabal check

  # ---------------------------------------------------------------------------
  # Build from the sdist, exactly as a Hackage user does (Linux-only).
  # CI otherwise builds the git tree; the tarball is what users install,
  # and any divergence (files missing from the sdist, dev-only project
  # settings) is invisible without this job.
  # ---------------------------------------------------------------------------

  sdist:
    name: Build from sdist
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-sdist-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-sdist-

      - name: Build the tarball a Hackage user gets
        run: |
          cabal sdist -o "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/sdist/nova-cache-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/nova-cache-*/
          cabal build all -f server --enable-tests

  # ---------------------------------------------------------------------------
  # Exercise the cbits shim under ASan/UBSan (Linux-only).  The C99 job only
  # compiles it; this one RUNS it, so a stray pointer or an overflow in the
  # hand-written C fails CI instead of corrupting a decompressed NAR in
  # production.  The bzip2 suite is the whole target: lib:bzip2 is the only
  # component with c-sources, and the C behind xz and zstd belongs to
  # dependencies this job deliberately leaves uninstrumented.  Linux is the
  # host because GHC's mingw toolchain ships no sanitizer runtime and the
  # shim is platform-independent, so one instrumented host is real coverage.
  # ---------------------------------------------------------------------------

  sanitizers:
    name: ASan/UBSan
    needs: [cabal-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      # Its own key, like sdist and deploy: this job builds neither the
      # server flag nor the xz and zstd sublibraries, so its store holds a
      # different set than the matrix build's.  Dependencies land in it
      # unsanitized - the flags below are scoped to this package alone.
      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-sanitize-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-sanitize-

      # Scoped through cabal.project.local so only this package's cbits
      # compile instrumented and only its test executable links the
      # sanitizer runtimes; a command-line --ghc-options would rebuild every
      # dependency instrumented too.  -fno-sanitize-recover makes each UBSan
      # report fatal rather than a log line CI would scroll past.  No
      # -Werror here: the warnings gate is the build matrix, and this job's
      # signal is runtime findings.
      - name: Scope sanitizer flags to this package
        run: |
          {
            echo "package nova-cache"
            echo "  ghc-options: -optc-fsanitize=address,undefined -optc-fno-sanitize-recover=all -optl-fsanitize=address,undefined"
          } > cabal.project.local

      - name: Build with instrumented cbits
        run: cabal build nova-cache-bzip2-test

      # cabal reuses an existing C object across a ghc-options change, so a
      # warm build tree can link an uninstrumented shim and leave this job
      # green having tested nothing.  Fail loudly instead of silently.
      - name: Confirm the shim is instrumented
        run: |
          obj=$(find dist-newstyle -name 'nova_bzip2.o' -print -quit)
          if [ -z "$obj" ]; then
            echo "nova_bzip2.o not found; the bzip2 sublibrary did not build"
            exit 1
          fi
          if ! nm "$obj" | grep -q '__asan'; then
            echo "$obj carries no ASan instrumentation; the flags did not reach the C compile"
            exit 1
          fi

      # detect_leaks=0: LeakSanitizer would report the GHC RTS's
      # process-lifetime allocations, plus any bz_stream whose ForeignPtr
      # finalizer the RTS never ran before exit - neither is a shim defect.
      # The stream's own teardown path is exercised by the suite itself.
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: cabal test nova-cache-bzip2-test

  # ---------------------------------------------------------------------------
  # Deploy (main branch only): build on the hosted arm64 image, ship the
  # binary.  anv26 is an Ampere box on the same Ubuntu 24.04, so the
  # runner's glibc matches - and the production host deliberately carries
  # no compiler toolchain.
  # ---------------------------------------------------------------------------

  deploy-server:
    name: Deploy Server
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-deploy-arm-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-deploy-arm-

      - name: Build the server binary (arm64)
        run: |
          cabal build --flag server --ghc-options="-Wall -Werror"
          cp "$(cabal list-bin --flag server nova-cache-server)" /tmp/nova-cache-server

      - name: Deploy to OCI
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
          # Cloudflare Access service token: reach the box through Access,
          # since its public port 22 is closed now.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Install cloudflared (the arm64 asset - this runner is arm) and
          # reach the box through Cloudflare Access: its public port 22 is
          # closed, so SSH is Access-only now.
          # Pinned version + checksum: the deploy must not run whatever
          # binary "latest" serves on a given day.
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.1/cloudflared-linux-arm64 -o /tmp/cloudflared
          echo "18f2c9bfc7a67a971bd96f1a5a1935def3c1e52aa386626f1566f04e9b5478d6  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          mkdir -p ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          cat >> ~/.ssh/config <<'SSHCFG'
          Host anv26
            HostName ${{ secrets.OCI_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/oci_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
          SSHCFG

          # Render the service unit.  The API key is not embedded in the
          # unit: systemd loads it from /etc/nix-cache/env (written below,
          # root-only), so the unit file carries no credentials.
          cat > /tmp/nova-cache.service <<'EOF'
          [Unit]
          Description=Nova Cache Server
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          ExecStart=/usr/local/bin/nova-cache-server --port 5000 --store /var/lib/nix-cache
          Restart=always
          RestartSec=5
          Environment=PORT=5000
          Environment=NIX_CACHE_DIR=/var/lib/nix-cache
          Environment=SIGNING_KEY_FILE=/etc/nix-cache/secret-key
          EnvironmentFile=/etc/nix-cache/env

          [Install]
          WantedBy=multi-user.target
          EOF

          scp /tmp/nova-cache.service anv26:/tmp/nova-cache.service
          # The binary rides the same Access tunnel as everything else; the
          # service keeps serving during the transfer and stops only for
          # the install below.
          scp /tmp/nova-cache-server anv26:/tmp/nova-cache-server

          # Provision the API key as a root-only environment file.  The value
          # travels over stdin, so it appears in no command line, no log, and
          # no file on the runner.
          printf 'CACHE_API_KEY=%s\n' "$CACHE_API_KEY" | ssh anv26 \
            "sudo sh -c 'umask 077; mkdir -p /etc/nix-cache; cat > /etc/nix-cache/env; chown root:root /etc/nix-cache/env; chmod 600 /etc/nix-cache/env'"

          ssh anv26 "\
            sudo systemctl stop nova-cache.service && \
            sudo install -m 0755 /tmp/nova-cache-server /usr/local/bin/nova-cache-server && \
            sudo cp /tmp/nova-cache.service /etc/systemd/system/nova-cache.service && \
            rm -f /tmp/nova-cache-server /tmp/nova-cache.service && \
            sudo systemctl daemon-reload && \
            sudo systemctl start nova-cache.service && \
            sudo systemctl status nova-cache.service --no-pager"
