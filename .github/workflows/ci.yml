name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  ascii:
    name: ASCII source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source must be ASCII-only
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.hs' '*.cabal' '*.md' '*.nix' '*.sh'; then
            echo "Non-ASCII characters found above; keep the source ASCII-only (no smart quotes, em-dashes, or Unicode arrows)."
            exit 1
          fi

  lint:
    name: HLint
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/", "exe/"]'
          fail-on: warning

  format:
    name: Ormolu
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to the version the repo is formatted with: formatting is
      # not stable across ormolu releases, and a floating version would
      # fail CI on untouched code when upstream ships one.  Upgrades
      # bump this and the local binary together.
      #
      # Built from Hackage, not fetched prebuilt: run-ormolu@v21
      # downloads binaries from mrkkrp/ormolu, and that repository
      # vanished from GitHub on 2026-08-20, taking every prebuilt
      # ormolu with it (the action then misreports the 404 as
      # "unformatted files").  The Hackage build depends on nothing but
      # the package index; the cached binary makes warm runs seconds.
      # Undo into the action if prebuilt assets return to a stable home
      # a released run-ormolu points at.
      - name: Cache formatter binary
        id: formatter-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/ormolu
          key: ormolu-0.9.0.0-${{ runner.os }}

      - uses: haskell-actions/setup@v2
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Build ormolu 0.9.0.0 from Hackage
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        run: cabal install ormolu-0.9.0.0 --install-method=copy --installdir="$HOME/.local/bin" --overwrite-policy=always

      - name: Check formatting
        run: git ls-files '*.hs' | xargs ormolu --mode check

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.name }})
    needs: [lint, format, cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      # all + -f server + --enable-tests so the server executable, the xz
      # sublibrary, and the test suites hit the same -Werror bar as the
      # library on every OS.  No liblzma setup: lzma-static bundles the C
      # sources.  The sdist job builds the same set from the tarball.
      - name: Build
        run: cabal build all -f server --enable-tests --ghc-options="-Werror"

      - name: Test
        run: cabal test -f server --ghc-options="-Werror"

  # ---------------------------------------------------------------------------
  # Packaging check (Linux-only)
  # ---------------------------------------------------------------------------

  cabal-check:
    name: Cabal Check
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'
      - run: cabal check

  # ---------------------------------------------------------------------------
  # Build from the sdist, exactly as a Hackage user does (Linux-only).
  # CI otherwise builds the git tree; the tarball is what users install,
  # and any divergence (files missing from the sdist, dev-only project
  # settings) is invisible without this job.
  # ---------------------------------------------------------------------------

  sdist:
    name: Build from sdist
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-sdist-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-sdist-

      - name: Build the tarball a Hackage user gets
        run: |
          cabal sdist -o "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/sdist/nova-cache-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/nova-cache-*/
          cabal build all -f server --enable-tests

  # ---------------------------------------------------------------------------
  # Deploy (main branch only): build on the hosted arm64 image, ship the
  # binary.  anv26 is an Ampere box on the same Ubuntu 24.04, so the
  # runner's glibc matches - and the production host deliberately carries
  # no compiler toolchain.
  # ---------------------------------------------------------------------------

  deploy-server:
    name: Deploy Server
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-deploy-arm-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-deploy-arm-

      - name: Build the server binary (arm64)
        run: |
          cabal build --flag server --ghc-options="-Wall -Werror"
          cp "$(cabal list-bin --flag server nova-cache-server)" /tmp/nova-cache-server

      - name: Deploy to OCI
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
          # Cloudflare Access service token: reach the box through Access,
          # since its public port 22 is closed now.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Install cloudflared (the arm64 asset - this runner is arm) and
          # reach the box through Cloudflare Access: its public port 22 is
          # closed, so SSH is Access-only now.
          # Pinned version + checksum: the deploy must not run whatever
          # binary "latest" serves on a given day.
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.1/cloudflared-linux-arm64 -o /tmp/cloudflared
          echo "18f2c9bfc7a67a971bd96f1a5a1935def3c1e52aa386626f1566f04e9b5478d6  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          mkdir -p ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          cat >> ~/.ssh/config <<'SSHCFG'
          Host anv26
            HostName ${{ secrets.OCI_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/oci_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
          SSHCFG

          # Render the service unit.  The API key is not embedded in the
          # unit: systemd loads it from /etc/nix-cache/env (written below,
          # root-only), so the unit file carries no credentials.
          cat > /tmp/nova-cache.service <<'EOF'
          [Unit]
          Description=Nova Cache Server
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          ExecStart=/usr/local/bin/nova-cache-server --port 5000 --store /var/lib/nix-cache
          Restart=always
          RestartSec=5
          Environment=PORT=5000
          Environment=NIX_CACHE_DIR=/var/lib/nix-cache
          Environment=SIGNING_KEY_FILE=/etc/nix-cache/secret-key
          EnvironmentFile=/etc/nix-cache/env

          [Install]
          WantedBy=multi-user.target
          EOF

          scp /tmp/nova-cache.service anv26:/tmp/nova-cache.service
          # The binary rides the same Access tunnel as everything else; the
          # service keeps serving during the transfer and stops only for
          # the install below.
          scp /tmp/nova-cache-server anv26:/tmp/nova-cache-server

          # Provision the API key as a root-only environment file.  The value
          # travels over stdin, so it appears in no command line, no log, and
          # no file on the runner.
          printf 'CACHE_API_KEY=%s\n' "$CACHE_API_KEY" | ssh anv26 \
            "sudo sh -c 'umask 077; mkdir -p /etc/nix-cache; cat > /etc/nix-cache/env; chown root:root /etc/nix-cache/env; chmod 600 /etc/nix-cache/env'"

          ssh anv26 "\
            sudo systemctl stop nova-cache.service && \
            sudo install -m 0755 /tmp/nova-cache-server /usr/local/bin/nova-cache-server && \
            sudo cp /tmp/nova-cache.service /etc/systemd/system/nova-cache.service && \
            rm -f /tmp/nova-cache-server /tmp/nova-cache.service && \
            sudo systemctl daemon-reload && \
            sudo systemctl start nova-cache.service && \
            sudo systemctl status nova-cache.service --no-pager"
