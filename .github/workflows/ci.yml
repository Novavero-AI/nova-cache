name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  lint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.8'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/", "exe/"]'
          fail-on: warning

  format:
    name: Ormolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/run-ormolu@v17
        with:
          pattern: |
            src/**/*.hs
            test/**/*.hs
            exe/**/*.hs

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.name }})
    needs: [lint, format, cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            compression: true
          - os: macos-latest
            name: macOS
            compression: true
          - os: windows-latest
            name: Windows
            compression: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            C:\cabal\store
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-cache.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Install liblzma (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev

      - name: Build
        run: cabal build --ghc-options="-Werror" ${{ matrix.compression == false && '-f-compression' || '' }}

      - name: Test
        run: cabal test ${{ matrix.compression == false && '-f-compression' || '' }}

  # ---------------------------------------------------------------------------
  # Packaging check (Linux-only)
  # ---------------------------------------------------------------------------

  cabal-check:
    name: Cabal Check
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'
      - run: cabal check

  # ---------------------------------------------------------------------------
  # Deploy (Linux, main branch only)
  # ---------------------------------------------------------------------------

  deploy-server:
    name: Deploy Server
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/deploy-via-access') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
          # Cloudflare Access service token: reach the box through Access,
          # since its public port 22 is closed now.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Install cloudflared and reach the box through Cloudflare Access:
          # its public port 22 is closed, so SSH is Access-only now.
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          mkdir -p ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          cat >> ~/.ssh/config <<'SSHCFG'
          Host anv26
            HostName anv26.novavero.ai
            User ubuntu
            IdentityFile ~/.ssh/oci_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
          SSHCFG

          # Render service file with API key from GitHub secret
          cat > /tmp/nova-cache.service <<EOF
          [Unit]
          Description=Nova Cache Server
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          ExecStart=/usr/local/bin/nova-cache-server --port 5000 --store /var/lib/nix-cache
          Restart=always
          RestartSec=5
          Environment=PORT=5000
          Environment=NIX_CACHE_DIR=/var/lib/nix-cache
          Environment=CACHE_API_KEY=${CACHE_API_KEY}
          Environment=SIGNING_KEY_FILE=/etc/nix-cache/secret-key

          [Install]
          WantedBy=multi-user.target
          EOF

          scp /tmp/nova-cache.service anv26:/tmp/nova-cache.service

          ssh anv26 "\
            source ~/.ghcup/env && \
            cd ~/nova-cache && \
            git pull && \
            cabal update && \
            cabal clean && \
            cabal build --flag server --ghc-options='-Wall -Werror' && \
            BINARY=\$(cabal list-bin --flag server nova-cache-server) && \
            sudo systemctl stop nova-cache.service && \
            sudo cp \"\$BINARY\" /usr/local/bin/nova-cache-server && \
            sudo chmod +x /usr/local/bin/nova-cache-server && \
            sudo cp /tmp/nova-cache.service /etc/systemd/system/nova-cache.service && \
            sudo systemctl daemon-reload && \
            sudo systemctl start nova-cache.service && \
            sudo systemctl status nova-cache.service --no-pager"
